name: Daily Address Database Sync & Audit

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 定时执行
  workflow_dispatch: # 支持在 GitHub 控制台手动触发

permissions:
  contents: write

jobs:
  sync-addresses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Address Import
        run: |
          npx tsx scripts/verify_address_sync.ts
          npx tsx scripts/verify_sourced_addresses.ts

      - name: Run Daily Address Sync & Audit
        id: sync
        run: |
          npm run sync:addresses
          if git diff --quiet -- src/data/addresses/metadata.json src/data/addresses/osmApartments.json; then
            echo 'has_updates=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has_updates=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run Build Verification
        run: npm run build

      - name: Commit & Push Daily Updates
        if: steps.sync.outputs.has_updates == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Address Sync]"
          git add src/data/addresses/metadata.json src/data/addresses/osmApartments.json
          git commit -m "chore(addresses): sync mapped residential buildings"
          git push

      - name: Check Cloudflare Deployment Configuration
        if: steps.sync.outputs.has_updates == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          VITE_ADSENSE_ID: ${{ secrets.VITE_ADSENSE_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets'; exit 1; }
          test -n "$CF_PAGES_PROJECT" || { echo 'Set CF_PAGES_PROJECT repository variable'; exit 1; }
          test -n "$VITE_ADSENSE_ID" || { echo 'Set VITE_ADSENSE_ID repository secret for the Cloudflare build'; exit 1; }

      - name: Build Cloudflare Release
        if: steps.sync.outputs.has_updates == 'true'
        env:
          VITE_ADSENSE_ID: ${{ secrets.VITE_ADSENSE_ID }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.sync.outputs.has_updates == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch main
